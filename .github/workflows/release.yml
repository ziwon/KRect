name: Validate and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Repository-scoped homelab ARC scale set, following ziwon/bluesify.
    runs-on: krect
    container: ubuntu:24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Install validation tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git python3 dpkg util-linux python3-dbus python3-pyqt5 libqt5svg5 desktop-file-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          from tools.build_deb import debian_version
          version = json.loads(Path('package/metadata.json').read_text())['KPlugin']['Version']
          debian_version(version, '24.04')
          assert json.loads(Path('package.json').read_text())['version'] == version
          stable = json.loads(Path('site/config.json').read_text())['release']
          if '-rc.' in version:
              assert re.fullmatch(r'\d+\.\d+\.\d+', stable), 'Landing page must point to a stable release'
              assert tuple(map(int, stable.split('.'))) < tuple(map(int, version.split('-')[0].split('.')))
          else:
              assert stable == version
          assert f'VERSION = "{version}"' in Path('app/krect/__init__.py').read_text()
          assert f'version: "{version}"' in Path('src/main.js').read_text()
          if os.environ['REF_TYPE'] == 'tag':
              assert os.environ['REF_NAME'] == f'v{version}', 'Tag must match package version'
          PY
      - name: Test and build distributions
        run: |
          node --test tests/*.test.cjs
          # Installer tests must run as a desktop user, not container root.
          runuser -u nobody -- python3 -m unittest discover -s tests -p 'test_*.py' -v
          bash -n install.sh uninstall.sh tools/plasma-tools.sh tools/smoke-deb.sh
          python3 tools/build.py
          python3 tools/build_site.py
          QT_QPA_PLATFORM=offscreen /usr/bin/python3 app/main.py --smoke-test
          desktop-file-validate app/org.krect.KRect.desktop
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code -- package/contents/code/main.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: |
            dist/*.kwinscript
            dist/*.zip
          if-no-files-found: error

  deb:
    needs: validate
    runs-on: krect
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: '24.04'
            plasma: '5'
          - ubuntu: '26.04'
            plasma: '6'
    container: ubuntu:${{ matrix.ubuntu }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install packaging tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git python3 dpkg-dev lintian desktop-file-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and check Ubuntu package
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
          PLASMA_MAJOR: ${{ matrix.plasma }}
        run: |
          SOURCE_DATE_EPOCH=$(git -c safe.directory="$GITHUB_WORKSPACE" log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          python3 tools/build_deb.py --ubuntu "$UBUNTU_VERSION"
          lintian --fail-on error dist/*.deb
          bash tools/smoke-deb.sh dist/*.deb "$PLASMA_MAJOR"
          QT_QPA_PLATFORM=offscreen python3 -m unittest discover -s tests -p 'test_assist.py' -v
          QT_QPA_PLATFORM=offscreen python3 -m unittest discover -s tests -p 'test_snap.py' -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-ubuntu-${{ matrix.ubuntu }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [validate, deb]
    runs-on: krect
    container: ubuntu:24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - name: Install release tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git gh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          notes_file="../docs/releases/${RELEASE_TAG#v}.md"
          test -f "$notes_file" || { echo "Missing bilingual release notes: $notes_file" >&2; exit 1; }
          sha256sum -- *.deb *.kwinscript *.zip > SHA256SUMS
          release_flags=()
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --notes-file "$notes_file" --title "KRect $RELEASE_TAG" "${release_flags[@]}"
          elif [[ "$RELEASE_TAG" == *-rc.* ]]; then
            gh release edit "$RELEASE_TAG" --prerelease --latest=false
          fi
          gh release upload "$RELEASE_TAG" --clobber -- *.deb *.kwinscript *.zip SHA256SUMS
