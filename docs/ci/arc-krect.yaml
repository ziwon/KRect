# Reference copy of the app in ziwon/homelab platform/stacks/01-platforms/overlays/home/arc.yaml.
# The existing ARC controller, namespaces, Harbor access, and GitHub auth are reused.
apps:
  - name: gha-runner-scale-set-krect
    namespace: arc-runners
    project: dev
    syncWave: "10"
    dependencies:
      - gha-runner-scale-set-controller
      - arc-runners-raw
    source:
      repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: 0.13.0
      helm:
        releaseName: krect
        values: |
          githubConfigUrl: https://github.com/ziwon/KRect
          githubConfigSecret: managed-github-auth-ziwon
          runnerScaleSetName: krect
          minRunners: 0
          maxRunners: 1
          containerMode: {}
          controllerServiceAccount:
            name: arc-gha-rs-controller
            namespace: arc-systems
          template:
            spec:
              imagePullSecrets:
                - name: harbor-pull-secret
              volumes:
                - name: work
                  emptyDir:
                    sizeLimit: 2Gi
                - name: dind-sock
                  emptyDir: {}
                - name: docker-data
                  emptyDir:
                    sizeLimit: 8Gi
              containers:
                - name: runner
                  image: harbor.home.lab/restack/actions-runner:latest
                  imagePullPolicy: IfNotPresent
                  command: ["/bin/bash", "-c"]
                  args:
                    - |
                      for attempt in $(seq 1 60); do
                        if docker info >/dev/null 2>&1; then exec /home/runner/run.sh; fi
                        sleep 1
                      done
                      echo "Docker daemon did not become ready" >&2
                      exit 1
                  env:
                    - name: DOCKER_HOST
                      value: unix:///var/run/docker.sock
                  resources:
                    requests:
                      cpu: "1"
                      memory: 2Gi
                      ephemeral-storage: 1Gi
                    limits:
                      cpu: "4"
                      memory: 4Gi
                      ephemeral-storage: 4Gi
                  volumeMounts:
                    - name: work
                      mountPath: /home/runner/_work
                    - name: dind-sock
                      mountPath: /var/run
                - name: dind
                  image: docker:dind
                  securityContext:
                    privileged: true
                  args:
                    - dockerd
                    - --host=unix:///var/run/docker.sock
                    - --group=1001
                  startupProbe:
                    exec:
                      command: ["docker", "info"]
                    periodSeconds: 2
                    failureThreshold: 30
                  env:
                    - name: DOCKER_TLS_CERTDIR
                      value: ""
                  resources:
                    requests:
                      cpu: "1"
                      memory: 1Gi
                      ephemeral-storage: 2Gi
                    limits:
                      cpu: "2"
                      memory: 4Gi
                      ephemeral-storage: 10Gi
                  volumeMounts:
                    - name: work
                      mountPath: /home/runner/_work
                    - name: dind-sock
                      mountPath: /var/run
                    - name: docker-data
                      mountPath: /var/lib/docker
